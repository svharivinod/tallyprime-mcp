[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallyprime-mcp"
version = "0.1.0"
description = "MCP server for TallyPrime accounting software"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tallyprime-mcp     = "tallyprime_mcp.server:main"
tallyprime-mcp-http = "tallyprime_mcp.server_http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tallyprime_mcp"]
